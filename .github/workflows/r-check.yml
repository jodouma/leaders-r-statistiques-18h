name: R base — TP et références
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: R fourni par Ubuntu (parcours étudiant)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ ! -x /usr/bin/Rscript ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends r-base-core
          fi
          echo "/usr/bin" >> "$GITHUB_PATH"
          /usr/bin/Rscript -e 'print(R.version.string); stopifnot(getRversion() >= "4.1.0")'
      - uses: r-lib/actions/setup-r@v2
        if: runner.os != 'Linux'
        with:
          r-version: release
          use-public-rspm: false
      - name: Contrats de la référence
        run: Rscript tests/run_tests.R
      - name: Parcours des quatre TP et contrôles apprenants
        run: Rscript tests/learner_checks.R
      - name: Référence complète facultative
        run: Rscript scripts/01_run_all.R
      - name: Mini-exemples facultatifs
        run: |
          Rscript examples/mini_regression.R
          Rscript examples/mini_bootstrap.R
          Rscript examples/mini_mapreduce.R
      - name: Ancien TP06 facultatif conservé en archive
        run: Rscript legacy/solutions/TP06_capstone_solution.R
