name: R base — tests et pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: false
      - name: Contrats et invariants
        run: Rscript tests/run_tests.R
      - name: Pipeline complet
        run: Rscript scripts/01_run_all.R
      - name: Mission autonome
        run: Rscript solutions/TP06_capstone_solution.R
