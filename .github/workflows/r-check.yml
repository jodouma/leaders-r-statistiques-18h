name: R base — TP et références
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: R fourni par Ubuntu (parcours étudiant)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ ! -x /usr/bin/Rscript ]; then
            # Avoid a slow runner mirror; keep Ubuntu's signed official packages.
            . /etc/os-release
            ubuntu_sources="$RUNNER_TEMP/r-ubuntu.list"
            for suite in "$VERSION_CODENAME" "$VERSION_CODENAME-updates"; do
              echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu $suite main universe"
            done > "$ubuntu_sources"
            echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu $VERSION_CODENAME-security main universe" >> "$ubuntu_sources"
            apt_options=(-o "Dir::Etc::sourcelist=$ubuntu_sources" -o "Dir::Etc::sourceparts=-" -o Acquire::Retries=2 -o Acquire::https::Timeout=30)
            sudo apt-get "${apt_options[@]}" update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install --yes --no-install-recommends r-base-core
          fi
          echo "/usr/bin" >> "$GITHUB_PATH"
          /usr/bin/Rscript -e 'print(R.version.string); stopifnot(getRversion() >= "4.1.0")'
      - uses: r-lib/actions/setup-r@v2
        if: runner.os != 'Linux'
        with:
          r-version: release
          use-public-rspm: false
      - name: Installation et fichiers du parcours
        run: Rscript 00_verifier_installation.R
      - name: Huit missions, exemples et contrôles isolés
        run: Rscript tests/run_tests.R
