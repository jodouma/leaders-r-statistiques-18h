<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="320" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
<title id="title">Le parcours d'apprentissage avec R</title>
<desc id="desc">Cinq étapes : se préparer, manipuler, explorer, comparer, communiquer. Carte de progression pédagogique sans durée.</desc>
<rect width="1400" height="320" rx="24" fill="#F6F7FB"/>
<g fill="none" stroke="#B4C5FF" stroke-width="5"><path d="M140 105H1260"/></g>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
<g transform="translate(140 105)"><circle r="38" fill="#FF9A3C"/><text y="10" font-size="30" font-weight="700" fill="#07152F">0</text><text y="88" font-size="24" font-weight="700" fill="#2B3180">Se préparer</text><text y="122" font-size="17" fill="#666270">Ouvrir le projet</text><text y="147" font-size="17" fill="#666270">Vérifier son environnement</text></g>
<g transform="translate(420 105)"><circle r="38" fill="#2B3180"/><text y="10" font-size="30" font-weight="700" fill="#FFFFFF">1</text><text y="88" font-size="24" font-weight="700" fill="#2B3180">Manipuler</text><text y="122" font-size="17" fill="#666270">Lire des données</text><text y="147" font-size="17" fill="#666270">Transformer avec soin</text></g>
<g transform="translate(700 105)"><circle r="38" fill="#2B3180"/><text y="10" font-size="30" font-weight="700" fill="#FFFFFF">2</text><text y="88" font-size="24" font-weight="700" fill="#2B3180">Explorer</text><text y="122" font-size="17" fill="#666270">Résumer et visualiser</text><text y="147" font-size="17" fill="#666270">Poser une question</text></g>
<g transform="translate(980 105)"><circle r="38" fill="#2B3180"/><text y="10" font-size="30" font-weight="700" fill="#FFFFFF">3</text><text y="88" font-size="24" font-weight="700" fill="#2B3180">Comparer</text><text y="122" font-size="17" fill="#666270">Quantifier l'incertitude</text><text y="147" font-size="17" fill="#666270">Interpréter avec prudence</text></g>
<g transform="translate(1260 105)"><circle r="38" fill="#2B3180"/><text y="10" font-size="30" font-weight="700" fill="#FFFFFF">4</text><text y="88" font-size="24" font-weight="700" fill="#2B3180">Communiquer</text><text y="122" font-size="17" fill="#666270">Justifier une conclusion</text><text y="147" font-size="17" fill="#666270">Rendre l'analyse reproductible</text></g>
</g></svg>
